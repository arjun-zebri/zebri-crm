# Zebri — staging migration deploy (Phase 0.7).
#
# Runs on every push to `staging` (which happens when a PR merges). Pushes
# pending Supabase migrations to the staging project. Vercel handles the
# app deploy via its own GitHub integration — this workflow is DB-only.
#
# Required secrets (configured in GitHub Settings → Environments → "staging"):
#   SUPABASE_ACCESS_TOKEN  — personal access token (https://supabase.com/dashboard/account/tokens)
#   SUPABASE_PROJECT_REF   — staging project ref (short slug from the project URL)
#   SUPABASE_DB_PASSWORD   — staging Postgres `postgres` user password
#
# First-run note: the ledger discrepancies introduced in Phase 0.2 (deleted
# demo migrations, renamed `drop_price_from_events`) need a one-time
# `supabase migration repair` against staging before this workflow can push
# cleanly. See .claude/docs/cicd.md → "First-run ledger reconciliation".

name: Deploy migrations · staging

on:
  push:
    branches: [staging]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/config.toml'

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  push-migrations:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 15

    steps:
      - name: Checkout (full history for migration safety diff)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Migration safety check
        run: bash scripts/check-migrations.sh "${{ github.event.before }}" "${{ github.sha }}"

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase link \
            --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}" \
            --password "${{ secrets.SUPABASE_DB_PASSWORD }}"

      - name: Push migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase db push \
            --password "${{ secrets.SUPABASE_DB_PASSWORD }}"
