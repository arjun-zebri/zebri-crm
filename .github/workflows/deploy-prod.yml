# Zebri — production migration deploy (Phase 0.7).
#
# Runs on every push to `main`. Configure the `production` GitHub
# Environment with required reviewers (Settings → Environments →
# production → "Required reviewers") so a human approves every prod DB
# change. Vercel handles the app deploy separately.
#
# Required secrets (configured in GitHub Settings → Environments → "production"):
#   SUPABASE_ACCESS_TOKEN  — personal access token
#   SUPABASE_PROJECT_REF   — prod project ref
#   SUPABASE_DB_PASSWORD   — prod Postgres `postgres` user password
#
# Same first-run ledger-reconciliation note applies as for staging — see
# .claude/docs/cicd.md.

name: Deploy migrations · production

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/config.toml'
  # Manual trigger from the Actions tab — required-reviewer gate still
  # applies (the `production` environment requires your click).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  push-migrations:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15

    steps:
      - name: Checkout (full history for migration safety diff)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Migration safety check
        run: bash scripts/check-migrations.sh "${{ github.event.before }}" "${{ github.sha }}"

      - name: Set up Supabase CLI
        # Pinned 2.65.5 from the GitHub release binary. Not npm: the
        # package rejects global installs, and unpinned CLI drift broke
        # CI's local stack (see ci.yml). Bump deliberately.
        run: |
          curl -fsSL https://github.com/supabase/cli/releases/download/v2.65.5/supabase_linux_amd64.tar.gz \
            | sudo tar -xz -C /usr/local/bin supabase
          supabase --version

      # IMPORTANT: secrets are passed via env vars, NEVER interpolated
      # directly into the shell `run:` block. GitHub's `${{ secrets.X }}`
      # substitution happens before bash parses the line, so a password
      # containing `$`/backtick/etc. (very common for Supabase-generated
      # passwords) would be mangled by shell expansion. The Supabase CLI
      # picks up `SUPABASE_DB_PASSWORD` natively — no `--password` flag.
      - name: Link Supabase project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: supabase link --project-ref "$PROJECT_REF"

      - name: Push migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push

      # Shadow-mode logging (Task 25): attach the write-logging trigger to
      # any public table that lacks it. A migration's own attach runs only
      # against the tables that exist when it runs, so on a hosted project
      # a table from an earlier-timestamped migration pushed later would
      # otherwise stay uncovered. Idempotent: returns 0 when nothing was
      # missing. Uses the Management API SQL endpoint with the same access
      # token the CLI uses, so no database host or pooler URL is needed.
      - name: Ensure shadow-mode triggers
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          response=$(curl --fail-with-body -sS -X POST \
            "https://api.supabase.com/v1/projects/${PROJECT_REF}/database/query" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"query": "select public.ensure_shadow_triggers() as attached;"}')
          echo "$response"
          attached=$(echo "$response" | jq -r '.[0].attached')
          # Non-zero means a table was uncovered on this project until now
          # (drift from an out-of-order push). It is fixed, but say so.
          if [ "$attached" != "0" ]; then
            echo "::warning title=Shadow-mode triggers::ensure_shadow_triggers() attached ${attached} table(s); coverage had drifted on this project."
          fi

      # Two-factor at the database (Task 23b): attach the restrictive
      # `require_mfa` policy to any RLS table that lacks it, for the same
      # out-of-order-push reason as the shadow triggers above. Idempotent:
      # returns 0 when nothing was missing. Also checks storage.objects,
      # which the migration attaches once (with only a WARNING if the
      # project refuses it), and fails the deploy if it is missing.
      - name: Ensure require_mfa policies
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          response=$(curl --fail-with-body -sS -X POST \
            "https://api.supabase.com/v1/projects/${PROJECT_REF}/database/query" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"query\": \"select public.ensure_require_mfa_policies() as attached, (select count(*)::int from pg_policy where polrelid = 'storage.objects'::regclass and polname = 'require_mfa' and not polpermissive) as storage;\"}")
          echo "$response"
          attached=$(echo "$response" | jq -r '.[0].attached')
          storage=$(echo "$response" | jq -r '.[0].storage')
          # Non-zero means a table was reachable at aal1 on this project
          # until now. It is fixed, but say so.
          if [ "$attached" != "0" ]; then
            echo "::warning title=require_mfa policies::ensure_require_mfa_policies() attached ${attached} table(s); two-factor coverage had drifted on this project."
          fi
          # A missing storage policy is not self-healing (the ensure
          # function covers public tables only) and leaves a 2FA MC's
          # private files open to a password-only session, so fail the
          # deploy instead of warning where nobody looks.
          if [ "$storage" != "1" ]; then
            echo "::error title=require_mfa on storage::storage.objects has no restrictive require_mfa policy. An aal1 session of a 2FA MC can still reach their files. Attach it (see 20261019000000) and re-run."
            exit 1
          fi

      # Post-deploy check: the three account-change triggers on auth.users
      # and auth.mfa_factors. The migration skips the mfa_factors ones with
      # only a WARNING if this project refuses the trigger privilege, so
      # surface a missing one here instead of in a log nobody reads.
      # Matched by schema and table name through pg_class, never by
      # regclass text, which drops the `auth.` prefix whenever the
      # session's search_path includes auth (review M2).
      - name: Check shadow-mode auth triggers
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          response=$(curl --fail-with-body -sS -X POST \
            "https://api.supabase.com/v1/projects/${PROJECT_REF}/database/query" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"query\": \"select count(*)::int as n from pg_trigger t join pg_class c on c.oid = t.tgrelid join pg_namespace ns on ns.oid = c.relnamespace where t.tgname like 'zz_log_shadow_%' and ns.nspname = 'auth' and c.relname in ('users', 'mfa_factors') and t.tgenabled <> 'D';\"}")
          echo "$response"
          n=$(echo "$response" | jq -r '.[0].n')
          if [ "$n" != "3" ]; then
            echo "::warning title=Shadow-mode auth triggers::found ${n} of 3 (zz_log_shadow_auth_user, zz_log_shadow_mfa, zz_log_shadow_mfa_status). Account or 2FA changes while shadowing may be unlogged."
          fi
