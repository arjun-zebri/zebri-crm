# Zebri — PR pipeline (Phase 0.7).
#
# Runs every gate established in 0.2–0.6 on every PR and on direct pushes
# to `main`/`staging`. Configure branch-protection on both branches in the
# GitHub UI to require this job — see `.claude/docs/cicd.md`.
#
# Order is "cheapest first" so the slow Supabase step doesn't burn 8 min
# when a TypeScript error would have failed in 30 seconds.

name: CI

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]
  # Manual fallback — if a webhook delivery gets dropped on the
  # floor, anyone with write access can re-fire the workflow from
  # the Actions tab via "Run workflow". Doesn't affect normal PR
  # behaviour.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gates:
    name: Gates (typecheck · lint · tests · build)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # ── Fast gates first ─────────────────────────────────────────────
      # Production-dependency advisories only (--omit=dev inside the
      # script). Dev tooling advisories are not gated; they burn down on
      # their own schedule. A high/critical is either fixed or named on a
      # dated allowlist entry in scripts/npm-audit-allowlist.json.
      - name: Dependency audit (prod deps, high+)
        run: npm run audit:gate

      - name: Typecheck (strict)
        run: npm run typecheck

      - name: Typecheck (strictness ratchet — must not exceed budget)
        run: npm run typecheck:strict:gate

      - name: Lint ratchet (errors + warnings must not exceed budget)
        run: npm run lint:gate

      - name: Service-role-key leak guard
        run: npm run check:no-service-role

      # Every outgoing email must go through lib/email/dispatch.ts, so
      # that it carries an idempotency key and reports its result. The
      # executor retries a failed step, and a direct provider call has
      # three times now shipped without one of those and turned a single
      # failed send into three copies in a couple's inbox.
      - name: Direct-email-send guard
        run: npm run check:no-direct-email-send

      - name: Dead-code report (knip — non-blocking until cleaned up)
        run: npm run deadcode
        continue-on-error: true

      - name: Unit tests
        run: npm run test:unit

      # ── Slower gates ──────────────────────────────────────────────────
      # `next build` imports every server module to collect page data and
      # pre-render statically-analysable pages. That means any module-top
      # SDK constructor and any page that touches the Supabase client at
      # import time would crash without env vars. These build-time dummies
      # are clearly marked DUMMY values — the build never makes outbound
      # calls, it just needs the constructors not to throw on import.
      # Real values live in Vercel env config for actual deploys.
      - name: Build
        env:
          # Supabase — used by lib/supabase/{client,server,middleware}.ts.
          NEXT_PUBLIC_SUPABASE_URL: https://ci-build-dummy.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci_publishable_dummy
          SUPABASE_SERVICE_ROLE_KEY: ci_service_role_dummy
          # Stripe — lib/payments/stripe.ts constructs at module top.
          # Proper lazy-init lands during the Payments page-hardening phase.
          STRIPE_SECRET_KEY: sk_test_BUILD_DUMMY_DO_NOT_USE
          # App / public URLs read at module level in a few places.
          NEXT_PUBLIC_APP_URL: https://ci-build-dummy.local
          # (lib/email is lazy-init — no RESEND_API_KEY dummy needed.)
        run: npm run build

      # Integration tests run against a real local Supabase stack
      # (migrations + seed.sql from a clean DB — proves the chain replays
      # and exercises RLS as production does). Slowest step, so last.
      #
      # Install the CLI directly via npm rather than the
      # `supabase/setup-cli@v1` Marketplace action — that action's
      # major-tag resolution started 404ing on codeload (likely a
      # moved tag) and the failure mode is opaque from inside CI.
      # The npm package is a thin wrapper around the binary +
      # platform detection; it's the same install path Supabase
      # itself recommends for local-dev pipelines.
      - name: Set up Supabase CLI
        # Pinned to 2.65.5, installed from the GitHub release binary.
        # Two reasons not to use npm: (1) `npm install -g supabase` is
        # rejected by the package's postinstall ("global install not
        # supported"); (2) leaving it unpinned pulled a newer CLI whose
        # `supabase start` changed the local stack so `service_role`
        # lost its grant on public tables — every integration suite then
        # died at the setup probe ("permission denied for table couples")
        # with no repo change. Bump deliberately + re-verify integration.
        run: |
          curl -fsSL https://github.com/supabase/cli/releases/download/v2.65.5/supabase_linux_amd64.tar.gz \
            | sudo tar -xz -C /usr/local/bin supabase
          supabase --version

      - name: Start local Supabase
        id: supabase_start
        # Registry fallback + trimmed service list; see the script header.
        run: ./scripts/ci-supabase-start.sh

      - name: Integration tests (RLS + DB)
        run: npm run test:integration

      # Only attempt to stop if `supabase start` actually succeeded —
      # otherwise an early failure (e.g. a fast gate) makes this step run
      # before the CLI is installed and explode with "command not found".
      - name: Stop local Supabase
        if: always() && steps.supabase_start.outcome == 'success'
        run: supabase stop --no-backup --workdir .

  # ── End to end ───────────────────────────────────────────────────────
  # The per-page Definition of Done requires e2e green on desktop and both
  # phones; this job runs it on every PR (non-blocking until the backlog
  # of pre-existing failures is fixed, see below). One matrix leg per device so
  # the three run side by side and a phone-only failure is its own red X.
  #
  # Each leg: a fresh local Supabase from the migrations, a PRODUCTION
  # build of the app pointed at it (`next build` + `next start`, so what
  # is tested is what ships, not the dev server), then Playwright through
  # `playwright.ci.config.ts`, whose global setup seeds the MC account the
  # specs log in as.
  #
  # PRs only (plus the manual trigger): the push that merges a green PR
  # would re-run the same tree. `needs: gates` keeps the cheapest-first
  # order: a type error fails in minutes without starting three stacks.
  #
  # No real secret is used or needed. Every key below is a blank or an
  # obviously fake test value, so no email, Slack alert or payment can
  # leave the runner:
  # - RESEND_API_KEY blank: the email dispatcher returns a failed send
  #   instead of calling Resend (lib/email/dispatch.ts).
  # - SLACK_WEBHOOK_URL blank, and NEXT_PUBLIC_APP_URL is loopback, which
  #   suppresses Slack on its own (lib/alerts/slack.ts slackSuppressed).
  # - STRIPE keys are fake `sk_test_`/`pk_test_` strings (the constructor
  #   needs a value), and STRIPE_API_HOST/PORT/PROTOCOL send the server's
  #   Stripe client to a dead loopback port, so a call fails on the runner
  #   and never reaches api.stripe.com.
  # - NOTION_API_KEY blank: lib/notion/client.ts throws before any fetch,
  #   and the feedback route records the sync as failed.
  # - ANTHROPIC_API_KEY blank: the SDK throws "could not resolve
  #   authentication" before any request, so Zebri AI fails closed.
  # - Auth emails (signup, reset) go to the stack's own Inbucket.
  # - CRON_SECRET, UNSUBSCRIBE_TOKEN_SECRET and EMAIL_CRED_KEY are fake
  #   values that exist only inside this ephemeral runner.
  e2e:
    name: E2E (${{ matrix.project }})
    needs: gates
    if: github.event_name != 'push'
    # Retries are 0 (playwright.ci.config.ts) while the backlog is red.
    # Non-blocking for now: 82 pre-existing desktop failures (Task 37 report) are a tracked backlog; flip to blocking once it is fixed.
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        include:
          - project: chromium
            slug: desktop
            browser: chromium
          - project: Mobile Chrome
            slug: pixel-5
            browser: chromium
          - project: Mobile Safari
            slug: iphone-12
            browser: webkit

    env:
      PROJECT: ${{ matrix.project }}
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3100
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3100
      # The seeded MC account (tests/e2e/global-setup.ts). Lives only in
      # this runner's throwaway database.
      TEST_EMAIL: e2e-ci@zebri.test
      TEST_PASSWORD: e2e-ci-password-NOT-A-SECRET
      STRIPE_SECRET_KEY: sk_test_E2E_DUMMY_DO_NOT_USE
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_E2E_DUMMY_DO_NOT_USE
      # Point the server's Stripe client at a dead loopback port
      # (lib/payments/stripe.ts): a spec that reaches a Stripe-calling
      # route fails on the runner and nothing is sent to api.stripe.com.
      STRIPE_API_HOST: 127.0.0.1
      STRIPE_API_PORT: '9'
      STRIPE_API_PROTOCOL: http
      RESEND_API_KEY: ''
      SLACK_WEBHOOK_URL: ''
      NOTION_API_KEY: ''
      ANTHROPIC_API_KEY: ''
      CRON_SECRET: e2e-ci-cron-secret-NOT-A-SECRET
      UNSUBSCRIBE_TOKEN_SECRET: e2e-ci-unsubscribe-secret-NOT-A-SECRET
      # 32 zero bytes, base64: the shape lib/crypto/secret-box.ts wants.
      EMAIL_CRED_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Same pinned CLI as the gates job; see the note there before bumping.
      - name: Set up Supabase CLI
        run: |
          curl -fsSL https://github.com/supabase/cli/releases/download/v2.65.5/supabase_linux_amd64.tar.gz \
            | sudo tar -xz -C /usr/local/bin supabase
          supabase --version

      - name: Start local Supabase
        id: supabase_start
        # Registry fallback + trimmed service list; see the script header.
        run: ./scripts/ci-supabase-start.sh

      # The local stack's keys are generated per stack, so read them back
      # rather than hard-coding them. Masked anyway: they grant full access
      # to this runner's database for as long as the job lives.
      - name: Export local Supabase keys
        run: |
          supabase status -o json --workdir . > "$RUNNER_TEMP/supabase.json"
          anon=$(jq -r .ANON_KEY "$RUNNER_TEMP/supabase.json")
          service=$(jq -r .SERVICE_ROLE_KEY "$RUNNER_TEMP/supabase.json")
          echo "::add-mask::$anon"
          echo "::add-mask::$service"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$(jq -r .API_URL "$RUNNER_TEMP/supabase.json")"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$anon"
            echo "SUPABASE_SERVICE_ROLE_KEY=$service"
          } >> "$GITHUB_ENV"

      # NEXT_PUBLIC_* values are inlined at build time, so the build has to
      # run after the stack is up and its URL is known.
      - name: Build
        run: npm run build

      - name: Start the app
        run: |
          nohup npm run start -- -H 127.0.0.1 -p 3100 > next-server.log 2>&1 &
          for _ in $(seq 1 60); do
            if curl -fsS -o /dev/null http://127.0.0.1:3100/login; then exit 0; fi
            sleep 2
          done
          echo "App did not answer on :3100 within 2 minutes"
          cat next-server.log
          exit 1

      - name: Read Playwright version
        id: playwright
        run: echo "version=$(npx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browser
        id: playwright_cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-${{ matrix.browser }}

      - name: Install Playwright browser
        if: steps.playwright_cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps ${{ matrix.browser }}

      # The cache holds the browser, not the apt packages it links against.
      - name: Install Playwright system dependencies
        if: steps.playwright_cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps ${{ matrix.browser }}

      # Three passes, in order (see playwright.ci.config.ts): everything
      # signed in from the saved state; then the specs that sign out
      # (sidebar sign-out revokes every session of the shared account);
      # then the specs that must start signed out. All three always run;
      # the step fails if any did.
      - name: Playwright
        run: |
          status=0
          for pass in main signout signed-out; do
            echo "::group::Playwright pass: $pass"
            E2E_PASS=$pass npx playwright test --config playwright.ci.config.ts --project="$PROJECT" || status=1
            echo "::endgroup::"
          done
          exit $status

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.slug }}
          path: |
            playwright-report*/
            test-results*/
            next-server.log
          retention-days: 14
          if-no-files-found: ignore

      - name: Stop local Supabase
        if: always() && steps.supabase_start.outcome == 'success'
        run: supabase stop --no-backup --workdir .
