# Zebri — PR pipeline (Phase 0.7).
#
# Runs every gate established in 0.2–0.6 on every PR and on direct pushes
# to `main`/`staging`. Configure branch-protection on both branches in the
# GitHub UI to require this job — see `.claude/docs/cicd.md`.
#
# Order is "cheapest first" so the slow Supabase step doesn't burn 8 min
# when a TypeScript error would have failed in 30 seconds.

name: CI

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gates:
    name: Gates (typecheck · lint · tests · build)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # ── Fast gates first ─────────────────────────────────────────────
      - name: Typecheck (strict)
        run: npm run typecheck

      - name: Typecheck (strictness ratchet — must not exceed budget)
        run: npm run typecheck:strict:gate

      - name: Lint ratchet (errors + warnings must not exceed budget)
        run: npm run lint:gate

      - name: Dead-code report (knip — non-blocking until cleaned up)
        run: npm run deadcode
        continue-on-error: true

      - name: Unit tests
        run: npm run test:unit

      # ── Slower gates ──────────────────────────────────────────────────
      # `next build` imports every server module to collect page data and
      # pre-render statically-analysable pages. That means any module-top
      # SDK constructor and any page that touches the Supabase client at
      # import time would crash without env vars. These build-time dummies
      # are clearly marked DUMMY values — the build never makes outbound
      # calls, it just needs the constructors not to throw on import.
      # Real values live in Vercel env config for actual deploys.
      - name: Build
        env:
          # Supabase — used by lib/supabase/{client,server,middleware}.ts.
          NEXT_PUBLIC_SUPABASE_URL: https://ci-build-dummy.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci_publishable_dummy
          SUPABASE_SERVICE_ROLE_KEY: ci_service_role_dummy
          # Stripe — lib/payments/stripe.ts constructs at module top.
          # Proper lazy-init lands during the Payments page-hardening phase.
          STRIPE_SECRET_KEY: sk_test_BUILD_DUMMY_DO_NOT_USE
          # App / public URLs read at module level in a few places.
          NEXT_PUBLIC_APP_URL: https://ci-build-dummy.local
          # (lib/email is lazy-init — no RESEND_API_KEY dummy needed.)
        run: npm run build

      # Integration tests run against a real local Supabase stack
      # (migrations + seed.sql from a clean DB — proves the chain replays
      # and exercises RLS as production does). Slowest step, so last.
      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase
        id: supabase_start
        run: supabase start --workdir .

      - name: Integration tests (RLS + DB)
        run: npm run test:integration

      # Only attempt to stop if `supabase start` actually succeeded —
      # otherwise an early failure (e.g. a fast gate) makes this step run
      # before the CLI is installed and explode with "command not found".
      - name: Stop local Supabase
        if: always() && steps.supabase_start.outcome == 'success'
        run: supabase stop --no-backup --workdir .
